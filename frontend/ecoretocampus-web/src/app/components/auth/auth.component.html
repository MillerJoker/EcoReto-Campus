<div class="auth-wrapper">
  <div class="auth-card">

    <h1 class="app-title">CampusLink</h1>
    
    <h2 class="screen-identifier">
      {{ isLoginMode ? 'Inicio de Sesión' : 'Registro de Usuario' }}
    </h2>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="name">Nombre:</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ingresa tu nombre" />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="correo@ejemplo.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Mínimo 6 caracteres" />
      </div>

      <button type="submit" [disabled]="authForm.invalid" class="btn-submit">
        {{ isLoginMode ? 'Entrar' : 'Registrarse' }}
      </button>
    </form>

    
    <div *ngIf="successMessage" class="alert success">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert error">
      {{ errorMessage }}
    </div>

    <div class="switch-mode">
      <a href="javascript:void(0)" (click)="onSwitchMode()">
        {{ isLoginMode ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión' }}
      </a>
    </div>
  </div>
</div>
